apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-vton-orchestrator
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "12"}
spec:
  project: lookddak-prod
  sources:
    - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
      targetRevision: main
      path: charts/lookddak-workload
      helm:
        releaseName: vton-orchestrator
        valueFiles:
          - $values/environments/prod/images.yaml
          - $values/environments/prod/domains/fitting/workloads/vton-orchestrator.yaml
    - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lookddak-fitting
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [PruneLast=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
