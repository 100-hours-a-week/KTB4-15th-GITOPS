apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-commerce-domain
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  project: lookddak-prod
  sources:
    - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
      targetRevision: main
      path: charts/lookddak-domain
      helm:
        releaseName: commerce-domain
        valueFiles: [$values/environments/prod/domains/commerce/domain.yaml]
    - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lookddak-commerce
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [PruneLast=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
