apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lookddak-prod-domains
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
        revision: main
        files:
          - path: environments/prod/domains/*/domain.yaml
  template:
    metadata:
      name: 'prod-{{ index .path.segments 3 }}-domain'
    spec:
      project: lookddak-prod
      sources:
        - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
          targetRevision: main
          path: charts/lookddak-domain
          helm:
            releaseName: '{{ index .path.segments 3 }}-domain'
            valueFiles:
              - '$values/{{ .path.path }}'
        - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: 'lookddak-{{ index .path.segments 3 }}'
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - PruneLast=true
