apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-prod-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: lookddak-prod-argocd
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: argocd/prod/workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
