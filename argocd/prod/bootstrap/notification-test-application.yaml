apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-prod-notification-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: lookddak-prod
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: tests/prod/notification-failure
  destination:
    server: https://kubernetes.default.svc
    namespace: lookddak-notification-test
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
    retry:
      limit: 2
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 30s
