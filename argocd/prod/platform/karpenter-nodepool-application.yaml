apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-prod-karpenter-nodepool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: lookddak-prod-platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/prod/karpenter/nodepool
    directory:
      include: "{ec2-nodeclass.yaml,nodepool.yaml,redis-nodepool.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
