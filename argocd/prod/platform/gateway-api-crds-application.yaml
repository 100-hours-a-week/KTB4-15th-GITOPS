apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-prod-gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: lookddak-prod-platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    # Gateway API v1.6.3 번들은 환경 독립 CRD이므로 Dev에서 검증한 고정 파일을 공유한다.
    path: platform/dev/networking/gateway-api/crds
    directory:
      include: standard-install.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
