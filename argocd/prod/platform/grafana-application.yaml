apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-prod-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: lookddak-prod-platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/prod/observability/grafana
    helm:
      releaseName: grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
