apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-dev-istio-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: lookddak-dev-platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/dev/networking/gateway
    directory:
      include: "{gateway.yaml,gateway-options.yaml,certificate.yaml,telemetry.yaml,grafana-ext-authz.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
