apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-dev-secrets-store-csi-provider-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: lookddak-dev-platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/dev/secrets-store-csi/provider-aws
    helm:
      releaseName: secrets-store-csi-provider-aws
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
