apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-dev-redis-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: lookddak-dev-platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/dev/redis/operator
    helm:
      releaseName: redis-operator
      # CRD는 lookddak-dev-redis-crds가 관리한다
      skipCrds: true
  destination:
    server: https://kubernetes.default.svc
    namespace: lookddak-redis
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
