apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # 기존 Helm Release 이름과 동일하게 유지한다.
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: lookddak-dev-argocd
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/dev/argocd
    helm:
      releaseName: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    # 비밀번호·서버 키·인증서는 기존 런타임 값을 유지한다. Git에 원문을 저장하지 않는다.
    - group: ""
      kind: Secret
      name: argocd-secret
      namespace: argocd
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - RespectIgnoreDifferences=true
      - PruneLast=true
