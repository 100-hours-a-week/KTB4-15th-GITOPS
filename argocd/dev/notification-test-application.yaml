apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-notification-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: lookddak-dev
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: tests/argocd-notifications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: lookddak-web
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
