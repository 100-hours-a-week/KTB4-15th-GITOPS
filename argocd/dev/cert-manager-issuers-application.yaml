apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-dev-cert-manager-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: lookddak-dev-platform
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/dev/cert-manager/issuers
    directory:
      include: cluster-issuers.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # ClusterIssuer CRD는 cert-manager Application이 만든다. CRD 준비 전 실패하면 retry로 다시 시도한다.
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
