apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-dev-root
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
      targetRevision: main
      path: argocd/projects
      directory:
        include: lookddak-dev*.yaml
    - repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
      targetRevision: main
      path: argocd/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
