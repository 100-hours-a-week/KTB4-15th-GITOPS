apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lookddak-dev-internal-api
  namespace: argocd
  annotations:
    # Namespace(-1)·도메인 ApplicationSet(0) 이후
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: lookddak-dev
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    targetRevision: main
    path: platform/dev/networking/internal-api
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: lookddak-web
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
