apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lookddak-dev-argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    notifications.argoproj.io/subscribe.on-deploy-failed.awssqs: lookddak-alert-queue
spec:
  description: 기존 Argo CD 설치를 GitOps로 관리하는 전용 Project
  sourceRepos:
    - https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
