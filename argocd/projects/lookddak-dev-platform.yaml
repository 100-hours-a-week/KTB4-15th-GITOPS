apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lookddak-dev-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: LookDDak dev 클러스터 플랫폼 구성요소 배포 범위
  sourceRepos:
    - https://github.com/100-hours-a-week/KTB4-15th-GITOPS.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiregistration.k8s.io
      kind: APIService
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
    - group: karpenter.sh
      kind: NodePool
  orphanedResources:
    warn: true
