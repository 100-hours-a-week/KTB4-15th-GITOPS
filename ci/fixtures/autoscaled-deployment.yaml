workload:
  name: fixture-autoscaled
  type: deployment

imageGroup: ai
images:
  ai:
    repository: example.invalid/lookddak
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

container:
  port: 8000

service:
  enabled: true
  port: 8000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

pdb:
  enabled: true
  maxUnavailable: 1

serviceAccount:
  create: true

secrets:
  enabled: true
  secretProviderClassName: fixture-autoscaled
  mountPath: /mnt/secrets-store
  parameters:
    objects: |
      - objectName: /fixture/ai/api-key
        objectType: ssmparameter
        objectAlias: RUNWARE_API_KEY
  startup:
    enabled: true
    environment:
      - name: RUNWARE_API_KEY
        fileName: RUNWARE_API_KEY
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
