name: GitOps CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gitops-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: GitOps CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 이미지 전용 PR 판별·검증
        id: change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA...HEAD")
            if printf '%s\n' "${changed_files[@]}" | grep -qx 'environments/prod/images.yaml'; then
              ruby scripts/validate-prod-image-change.rb "$BASE_SHA"
            else
              ruby scripts/validate-dev-image-change.rb "$BASE_SHA"
            fi
          else
            echo "image_only=false" >> "$GITHUB_OUTPUT"
            echo "수동 실행: 전체 GitOps 검증을 실행합니다."
          fi

      - name: 이미지 변경 검증기 테스트
        run: |
          ruby scripts/test-validate-dev-image-change.rb
          ruby scripts/test-update-dev-image.rb
          ruby scripts/test-validate-prod-image-change.rb
          ruby scripts/test-update-prod-image.rb

      - name: Helm 설치
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3

      - name: Helm Chart 캐시
        if: steps.change.outputs.image_only != 'true'
        uses: actions/cache@v4
        with:
          path: |
            platform/*/**/charts/*.tgz
          key: helm-charts-${{ hashFiles('platform/*/**/Chart.lock') }}
          restore-keys: |
            helm-charts-

      - name: Argo CD Helm Repository 등록
        if: steps.change.outputs.image_only != 'true'
        run: helm repo add argo https://argoproj.github.io/argo-helm

      - name: Metrics Server Helm Repository 등록
        if: steps.change.outputs.image_only != 'true'
        run: helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/

      - name: AWS Load Balancer Controller Helm Repository 등록
        if: steps.change.outputs.image_only != 'true'
        run: helm repo add eks https://aws.github.io/eks-charts

      - name: Istio Helm Repository 등록
        if: steps.change.outputs.image_only != 'true'
        run: helm repo add istio https://blob.istio.io/istio-release/charts

      - name: cert-manager Helm Repository 등록
        if: steps.change.outputs.image_only != 'true'
        run: helm repo add jetstack https://charts.jetstack.io

      - name: Redis Operator Helm Repository 등록
        if: steps.change.outputs.image_only != 'true'
        run: helm repo add ot-helm https://ot-container-kit.github.io/helm-charts

      - name: 모니터링 Helm Repository 등록
        if: steps.change.outputs.image_only != 'true'
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts

      - name: Argo CD Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: scripts/helm-dependency-build.sh platform/dev/argocd

      - name: Karpenter Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: |
          scripts/helm-dependency-build.sh platform/dev/karpenter/crd
          scripts/helm-dependency-build.sh platform/dev/karpenter/controller

      - name: Metrics Server Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: scripts/helm-dependency-build.sh platform/dev/metrics-server

      - name: AWS Load Balancer Controller Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: scripts/helm-dependency-build.sh platform/dev/networking/aws-load-balancer-controller

      - name: cert-manager Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: scripts/helm-dependency-build.sh platform/dev/cert-manager/controller

      - name: Redis Operator Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: |
          for env in dev prod; do
            scripts/helm-dependency-build.sh "platform/$env/redis/operator"
          done

      - name: 모니터링 Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: |
          for env in dev prod; do
            for chart in prometheus loki tempo alloy-node kube-state-metrics alloy-cluster grafana; do
              scripts/helm-dependency-build.sh "platform/$env/observability/$chart"
            done
          done

      - name: Istio Helm 의존성 준비
        if: steps.change.outputs.image_only != 'true'
        run: |
          for chart in base istiod cni ztunnel; do
            scripts/helm-dependency-build.sh "platform/dev/networking/istio/$chart"
          done

      - name: YAML 문법 검사
        run: ruby scripts/validate-yaml.rb

      - name: 저장소 구조 검사
        run: ruby scripts/validate-repository.rb

      - name: 전체 Helm Chart 검사
        if: steps.change.outputs.image_only != 'true'
        run: |
          helm lint charts/lookddak-workload
          helm lint charts/lookddak-domain
          helm lint platform/dev/argocd --namespace argocd --kube-version 1.36.0
          helm lint platform/prod/argocd --namespace argocd --kube-version 1.36.0
          helm lint platform/dev/karpenter/crd --namespace kube-system --kube-version 1.36.0
          helm lint platform/dev/karpenter/controller --namespace kube-system --kube-version 1.36.0
          helm lint platform/dev/metrics-server --namespace kube-system --kube-version 1.36.0
          helm lint platform/dev/networking/aws-load-balancer-controller --namespace kube-system --kube-version 1.36.0
          for chart in base istiod cni ztunnel; do
            helm lint "platform/dev/networking/istio/$chart" --namespace istio-system --kube-version 1.36.0
          done
          helm lint platform/dev/cert-manager/controller --namespace kube-system --kube-version 1.36.0
          for env in dev prod; do
            helm lint "platform/$env/redis/operator" --namespace lookddak-redis --kube-version 1.36.0
            for chart in prometheus loki tempo alloy-node kube-state-metrics alloy-cluster grafana; do
              helm lint "platform/$env/observability/$chart" --namespace monitoring --kube-version 1.36.0
            done
          done

      - name: 이미지 영향 Workload Chart 검사
        if: steps.change.outputs.image_only == 'true'
        run: helm lint charts/lookddak-workload

      - name: Helm Fixture 렌더링
        if: steps.change.outputs.image_only != 'true'
        run: scripts/render-fixtures.sh "$RUNNER_TEMP/rendered"

      - name: 이미지 영향 Workload 렌더링
        if: steps.change.outputs.image_only == 'true'
        env:
          IMAGE_ENVIRONMENT: ${{ steps.change.outputs.image_environment }}
          IMAGE_GROUP: ${{ steps.change.outputs.image_group }}
        run: scripts/render-${IMAGE_ENVIRONMENT}-image-workloads.sh "$IMAGE_GROUP" "$RUNNER_TEMP/rendered"

      - name: Argo CD System 배치·자기 관리 보호 설정 검사
        if: steps.change.outputs.image_only != 'true'
        run: |
          ruby scripts/validate-argocd-install.rb "$RUNNER_TEMP/rendered/argocd-dev.yaml" dev
          ruby scripts/validate-argocd-install.rb "$RUNNER_TEMP/rendered/argocd-prod.yaml" prod

      - name: 전체 Helm Manifest 변경점 출력
        if: github.event_name == 'pull_request' && steps.change.outputs.image_only != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/diff-rendered-manifests.sh "$BASE_SHA" "$RUNNER_TEMP/manifest-diff"

      - name: 이미지 영향 Manifest 변경점 출력
        if: github.event_name == 'pull_request' && steps.change.outputs.image_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IMAGE_ENVIRONMENT: ${{ steps.change.outputs.image_environment }}
          IMAGE_GROUP: ${{ steps.change.outputs.image_group }}
        run: scripts/diff-${IMAGE_ENVIRONMENT}-image-manifests.sh "$BASE_SHA" "$IMAGE_GROUP" "$RUNNER_TEMP/manifest-diff"

      - name: Kubernetes Schema 검사
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/rendered:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:461fae0fa54c5fe64028152533e57f6b88adb1d26dbafd80092e7310d349ae48 \
            -strict \
            -kubernetes-version 1.36.0 \
            -skip HTTPRoute,AuthorizationPolicy,SecretProviderClass,CustomResourceDefinition,Application,ApplicationSet,AppProject,NodePool,EC2NodeClass \
            -summary \
            /manifests

      - name: Karpenter NodePool·EC2NodeClass Schema 검사
        if: steps.change.outputs.image_only != 'true'
        run: |
          ruby scripts/extract-karpenter-schemas.rb \
            "$RUNNER_TEMP/rendered/karpenter-crd-dev.yaml" "$RUNNER_TEMP/karpenter-schemas"
          docker run --rm \
            -v "$RUNNER_TEMP/rendered:/manifests:ro" \
            -v "$RUNNER_TEMP/karpenter-schemas:/schemas:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:461fae0fa54c5fe64028152533e57f6b88adb1d26dbafd80092e7310d349ae48 \
            -strict \
            -schema-location '/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            /manifests/karpenter-ec2nodeclass-dev.yaml \
            /manifests/karpenter-nodepool-dev.yaml

      - name: Argo CD 리소스 Schema 검사
        if: steps.change.outputs.image_only != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:461fae0fa54c5fe64028152533e57f6b88adb1d26dbafd80092e7310d349ae48 \
            -strict \
            -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            /workspace/argocd/projects/lookddak-dev.yaml \
            /workspace/argocd/projects/lookddak-dev-argocd.yaml \
            /workspace/argocd/projects/lookddak-dev-platform.yaml \
            /workspace/argocd/dev/root-application.yaml \
            /workspace/argocd/dev/argocd-application.yaml \
            /workspace/argocd/dev/domain-applicationset.yaml \
            /workspace/argocd/dev/workload-applicationset.yaml \
            /workspace/argocd/dev/karpenter-crd-application.yaml \
            /workspace/argocd/dev/karpenter-controller-application.yaml \
            /workspace/argocd/dev/karpenter-nodepool-application.yaml \
            /workspace/argocd/dev/metrics-server-application.yaml \
            /workspace/argocd/dev/aws-load-balancer-controller-application.yaml \
            /workspace/argocd/dev/gateway-api-crds-application.yaml \
            /workspace/argocd/dev/istio-base-application.yaml \
            /workspace/argocd/dev/istiod-application.yaml \
            /workspace/argocd/dev/istio-cni-application.yaml \
            /workspace/argocd/dev/ztunnel-application.yaml \
            /workspace/argocd/dev/namespace-istio-system.yaml \
            /workspace/argocd/dev/cert-manager-application.yaml \
            /workspace/argocd/dev/cert-manager-issuers-application.yaml \
            /workspace/argocd/dev/namespace-istio-ingress.yaml \
            /workspace/argocd/dev/istio-gateway-application.yaml \
            /workspace/argocd/dev/network-policies-application.yaml \
            /workspace/argocd/dev/mesh-security-application.yaml \
            /workspace/argocd/dev/internal-api-application.yaml \
            /workspace/platform/dev/networking/gateway/gateway.yaml \
            /workspace/platform/dev/networking/gateway/gateway-options.yaml \
            /workspace/platform/dev/networking/gateway/certificate.yaml \
            /workspace/argocd/dev/namespace-web.yaml \
            /workspace/argocd/dev/namespace-identity.yaml \
            /workspace/argocd/dev/namespace-commerce.yaml \
            /workspace/argocd/dev/namespace-chat.yaml \
            /workspace/argocd/dev/namespace-fitting.yaml \
            /workspace/argocd/projects/lookddak-prod.yaml \
            /workspace/argocd/projects/lookddak-prod-argocd.yaml \
            /workspace/argocd/projects/lookddak-prod-platform.yaml

      - name: GitOps 정책 검사
        run: ruby scripts/validate-policy.rb

      - name: PR에 Manifest 변경점 댓글 작성
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          DIFF_FILE: ${{ runner.temp }}/manifest-diff/manifest.diff
          SUMMARY_FILE: ${{ runner.temp }}/manifest-diff/manifest-summary.md
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const commentManifestDiff = require('./.github/scripts/comment-manifest-diff.js')
            await commentManifestDiff({ github, context, core })
