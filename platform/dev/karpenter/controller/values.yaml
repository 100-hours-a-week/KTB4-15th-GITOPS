karpenter:
  settings:
    clusterName: lookddak-dev
    interruptionQueue: ""
    enableZonalShift: false

  serviceAccount:
    create: true
    name: karpenter
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::686496667254:role/lookddak-dev-karpenter-controller

  replicas: 2

  nodeSelector:
    kubernetes.io/os: linux
    lookddak.io/node-pool: system

  controller:
    # 실사용(2026-11-05 kubectl top): 리더 9m/152Mi, 대기 1m/28Mi
    # CPU limit은 두지 않는다 (스케일 계산 시 스로틀링 방지, System Node 여유 CPU 사용)
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  serviceMonitor:
    enabled: false

  logLevel: info
