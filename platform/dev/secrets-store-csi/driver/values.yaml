secrets-store-csi-driver:
  linux:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - operator: Exists
    priorityClassName: system-node-critical

  windows:
    enabled: false

  # Secret 값을 Kubernetes Secret으로 복제하지 않는다.
  syncSecret:
    enabled: false

  # 마운트된 파일은 1시간마다 원본 저장소의 최신 값으로 갱신한다.
  enableSecretRotation: true
  rotationPollInterval: 1h

  providerHealthCheck: true
  providerHealthCheckInterval: 2m

  # ASCP가 IRSA와 EKS Pod Identity 토큰을 모두 요청할 수 있게 한다.
  tokenRequests:
    - audience: sts.amazonaws.com
    - audience: pods.eks.amazonaws.com
