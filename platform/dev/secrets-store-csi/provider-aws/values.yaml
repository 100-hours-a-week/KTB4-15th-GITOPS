secrets-store-csi-driver-provider-aws:
  awsRegion: ap-northeast-2
  fullnameOverride: secrets-store-csi-driver-provider-aws

  # Driver는 별도 Argo CD Application에서 버전을 고정해 설치한다.
  secrets-store-csi-driver:
    install: false

  # ASCP가 마운트 대상 파일을 직접 작성하는 기본 방식을 사용한다.
  driverWritesSecrets: false

  nodeSelector:
    kubernetes.io/os: linux

  # System Node의 CriticalAddonsOnly Taint와 향후 Node Taint를 모두 허용한다.
  tolerations:
    - operator: Exists

  priorityClassName: system-node-critical

  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 50m
      memory: 100Mi

  securityContext:
    privileged: false
    allowPrivilegeEscalation: false

  useFipsEndpoint: false
