# Cilium 1.20.4 / EKS 1.36 (lookddak-dev) / ENI 모드
# 설치: bastion SSM 포트포워딩으로 helm upgrade --install (같은 디렉터리 README.md)
# IRSA Role·서브넷 태그: KTB4-15th-CLOUD infra/environments/dev/v3 (iam, network)

# kube-proxy 대체 (클러스터에 kube-proxy 없음: bootstrap_self_managed_addons = false)
# kube-proxy가 없어 kubernetes Service(ClusterIP)로 API 서버를 못 찾으므로 엔드포인트를 직접 준다
# (private 엔드포인트: VPC 안에서는 이 호스트 이름이 Control Plane ENI의 사설 IP로 풀린다)
kubeProxyReplacement: true
k8sServiceHost: BB1B461A85B61D9DEAD8BDABE8B8FE64.yl4.ap-northeast-2.eks.amazonaws.com
k8sServicePort: 443

# ENI IPAM: Pod가 VPC IP(보조 CIDR 100.65.0.0/16)를 직접 받는다. 캡슐화 없음
ipam:
  mode: eni
routingMode: native
eni:
  enabled: true
  # IRSA: cilium-operator ServiceAccount에 Role 어노테이션 (Terraform dev/v3/iam)
  iamRole: arn:aws:iam::686496667254:role/lookddak-dev-cilium-operator
  # /28 Prefix 단위 할당 (차트 기본값 false). Pod 서브넷 prefix 예약과 짝
  awsEnablePrefixDelegation: true
  # 남는 IP/Prefix 반납
  awsReleaseExcessIPs: true
  # Pod ENI는 Pod 서브넷(Tier=private-pod)에만 만든다
  subnetTagsFilter:
    - Tier=private-pod
  nodeSpec:
    # eth0(노드 서브넷)은 Pod에 쓰지 않는다
    firstInterfaceIndex: 1

# Istio Ambient 공존
# - istio-cni가 CNI 설정 파일에 체이닝할 수 있게 한다
cni:
  exclusive: false
# - Pod 안에서는 socket LB를 끈다 (ztunnel 리다이렉션과 충돌 방지)
socketLB:
  hostNamespaceOnly: true

# Istio Ambient kubelet probe 대응 (2026-11-05)
# istio-cni가 host iptables에서 probe 출발지를 169.254.7.127로 SNAT한다.
# eBPF Host Routing은 Pod 응답을 host iptables(conntrack)를 거치지 않고 ENI로 바로 보내
# 169.254.7.127 응답이 VPC로 나가 probe가 실패한다 → host stack 경유(Legacy)로 둔다
bpf:
  hostLegacyRouting: true

operator:
  replicas: 2
  # System Node에만 배치 (Application Node가 비면 Karpenter가 회수할 수 있게)
  nodeSelector:
    kubernetes.io/os: linux
    lookddak.io/node-pool: system
  # 차트 기본 Toleration + System Node 격리 Taint(CriticalAddonsOnly) 허용
  # (agent-not-ready Toleration은 차트가 항상 추가한다)
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
    - key: node-role.kubernetes.io/master
      operator: Exists
    - key: node.kubernetes.io/not-ready
      operator: Exists
    - key: node.cloudprovider.kubernetes.io/uninitialized
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists

# Envoy: standalone DaemonSet(cilium-envoy)을 끈다
# - L7(Gateway, mTLS, AuthorizationPolicy, 서킷 브레이커)은 Istio가 담당한다
# - L3/L4 정책, FQDN egress(DNS 프록시는 agent 내장), kube-proxy 대체에는 필요 없다
# - L7 CiliumNetworkPolicy를 쓰게 되면 agent 내장 Envoy가 필요할 때 실행된다
envoy:
  enabled: false

# Hubble: 흐름 수집만 켠다. Relay/UI는 관측 단계에서 켠다
hubble:
  enabled: true
  # Relay: 노드별 Hubble 흐름을 모아 CLI·UI에 제공 (agent ↔ relay mTLS 인증서는 helm이 생성)
  relay:
    enabled: true
    replicas: 1
    nodeSelector:
      kubernetes.io/os: linux
      lookddak.io/node-pool: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  # UI: 외부 공개 없이 kubectl port-forward로만 접속 (모든 트래픽 흐름이 보이므로)
  ui:
    enabled: true
    replicas: 1
    nodeSelector:
      kubernetes.io/os: linux
      lookddak.io/node-pool: system
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    backend:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
