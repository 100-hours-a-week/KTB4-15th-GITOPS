# Node 단위 L4 프록시. Ambient에 등록된 Pod 간 mTLS(HBONE, 15008)를 처리한다.
# DaemonSet: 모든 Node에서 실행 (차트 기본 Toleration: 모든 NoSchedule·NoExecute 허용)
ztunnel:
  # requests를 실측 기준으로 축소 (차트 기본 200m/512Mi는 Pod 약 20만 개·동시 연결 10만 개 규모 기준)
  # 2026-11-08 실측(kubectl top, 12개): CPU 1m, 메모리 4~6Mi (유휴). limit 없음 → 부하 시 노드 여유만큼 사용
  # 부하 테스트 중 최대값을 다시 측정해 조정한다
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
