apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-fitting-api-egress
spec:
  description: "Dev fitting-api의 MySQL 및 AWS API(S3) 연결 허용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-fitting
      k8s:app.kubernetes.io/name: fitting-api
  egress:
    # Dev MySQL RDS(V3 DB). 공통 도메인 정책의 CoreDNS 관측으로 RDS 주소 변경을 따라간다
    - toFQDNs:
        - matchName: lookddak-dev-v2-mysql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    # IRSA STS, 이미지 버킷(GetObject)
    - toFQDNs:
        - matchName: sts.ap-northeast-2.amazonaws.com
        - matchName: sts.amazonaws.com
        - matchName: lookddak-dev-images-686496667254-ap-northeast-2.s3.ap-northeast-2.amazonaws.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
