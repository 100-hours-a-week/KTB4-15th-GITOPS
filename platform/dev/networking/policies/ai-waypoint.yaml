apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-ai-waypoint-egress
spec:
  description: "AI waypoint(lookddak-identity/waypoint, lookddak-chat/egress-waypoint) → istiod(xDS)"
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - lookddak-identity
          - lookddak-chat
      - key: gateway.networking.k8s.io/gateway-name
        operator: In
        values:
          - waypoint
          - egress-waypoint
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-chat-egress-waypoint-external
spec:
  description: "lookddak-chat egress-waypoint → Runware LLM, OpenAI"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-chat
      gateway.networking.k8s.io/gateway-name: egress-waypoint
  egress:
    - toFQDNs:
        - matchName: api.runware.ai
        - matchName: api.openai.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-vton-to-chat-egress-waypoint
spec:
  description: "vton-orchestrator → lookddak-chat egress-waypoint(HBONE). ztunnel이 api.runware.ai ServiceEntry를 NS 구분 없이 적용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-fitting
      k8s:app.kubernetes.io/name: vton-orchestrator
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lookddak-chat
            gateway.networking.k8s.io/gateway-name: egress-waypoint
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-chat-egress-waypoint-from-vton
spec:
  description: "lookddak-chat egress-waypoint ← vton-orchestrator(HBONE)"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-chat
      gateway.networking.k8s.io/gateway-name: egress-waypoint
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lookddak-fitting
            k8s:app.kubernetes.io/name: vton-orchestrator
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
