apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-domain-otlp-export
spec:
  description: "도메인 Pod → monitoring/alloy-cluster OTLP 트레이스 전송 (HBONE 15008)"
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
        operator: Exists
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/instance: alloy-cluster
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
