# Ambient의 Pod 간 mTLS 연결은 HBONE TCP 15008을 사용한다.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-web-bff-to-identity-api
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-web
      k8s:app.kubernetes.io/name: web-bff
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lookddak-identity
            k8s:app.kubernetes.io/name: identity-api
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-identity-api-from-web-bff
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-identity
      k8s:app.kubernetes.io/name: identity-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lookddak-web
            k8s:app.kubernetes.io/name: web-bff
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
