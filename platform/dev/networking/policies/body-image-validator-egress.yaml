apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-body-image-validator-egress
spec:
  description: "Dev body-image-validator의 Modal 원격 검증 연결 허용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-identity
      k8s:app.kubernetes.io/name: body-image-validator
  egress:
    # 공통 도메인 정책의 DNS 관측을 사용해 원격 검증 호스트로만 HTTPS를 허용한다.
    - toFQDNs:
        - matchName: lookddak--lookddak-body-image-staging.us-east.modal.run
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
