# 도메인 Namespace 내부 통신 허용 (Namespace마다 1개)
# 새 도메인 Namespace를 추가하면 여기도 추가한다 (CI가 Namespace 목록과 비교)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-web-same-namespace
spec:
  description: "lookddak-web 내부 Pod 간 HBONE(15008) 허용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-web
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lookddak-web
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lookddak-web
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
---
