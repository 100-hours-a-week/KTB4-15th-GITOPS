# 도메인 Namespace 공통 정책 (기본 차단 + 공통 허용)
# - 이 정책이 선택한 Pod는 ingress·egress 모두 기본 차단된다 (policyEnforcementMode: default)
# - Ambient: Pod 간 통신은 HBONE(15008)으로 가므로 앱 포트가 아니라 15008을 연다
#   앱 포트·경로 단위 허용은 Istio AuthorizationPolicy로 한다
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-domain-baseline
spec:
  description: "도메인 Namespace 기본 차단, Ambient probe·Gateway·DNS 허용"
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
        operator: Exists
  ingress:
    # Ambient: kubelet probe는 istio-cni가 169.254.7.127로 SNAT한다
    - fromCIDR:
        - 169.254.7.127/32
    # 외부 진입: 공용 Istio Gateway → HBONE
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-ingress
            gateway.networking.k8s.io/gateway-name: lookddak-gateway
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
  egress:
    # CoreDNS. DNS 규칙으로 Cilium이 질의를 관측한다 (FQDN 정책의 전제)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
