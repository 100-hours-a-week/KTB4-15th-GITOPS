apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-chat-ai-egress
spec:
  description: "Dev chat-ai의 PostgreSQL, Runware LLM, OpenAI 임베딩 연결 허용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-chat
      k8s:app.kubernetes.io/name: chat-ai
  egress:
    # Dev PostgreSQL RDS. 공통 도메인 정책의 CoreDNS 관측으로 RDS 주소 변경을 따라간다
    - toFQDNs:
        - matchName: lookddak-dev-postgresql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Runware LLM API(채팅 생성), OpenAI 임베딩(상품 검색, EMBEDDING_MODEL=text-embedding-3-small)
    - toFQDNs:
        - matchName: api.runware.ai
        - matchName: api.openai.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
