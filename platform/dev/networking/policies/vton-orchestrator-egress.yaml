apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-vton-orchestrator-egress
spec:
  description: "Dev vton-orchestrator의 PostgreSQL, AWS API(S3·SQS), Runware VTON 연결 허용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-fitting
      k8s:app.kubernetes.io/name: vton-orchestrator
  egress:
    # Dev PostgreSQL RDS. 공통 도메인 정책의 CoreDNS 관측으로 RDS 주소 변경을 따라간다
    - toFQDNs:
        - matchName: lookddak-dev-postgresql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # IRSA STS, 이미지 버킷(Get·Put), 피팅 큐
    - toFQDNs:
        - matchName: sts.ap-northeast-2.amazonaws.com
        - matchName: sts.amazonaws.com
        - matchName: lookddak-dev-images-686496667254-ap-northeast-2.s3.ap-northeast-2.amazonaws.com
        - matchName: sqs.ap-northeast-2.amazonaws.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Runware VTON API·결과 이미지
    - toFQDNs:
        - matchName: api.runware.ai
        - matchName: im.runware.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
