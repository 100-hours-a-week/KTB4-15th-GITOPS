apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-domain-alloy-cluster-scrape
spec:
  description: "도메인 Pod ← monitoring/alloy-cluster 메트릭 수집 (HBONE 15008, waypoint 15020)"
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/instance: alloy-cluster
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
            - port: "15020"
              protocol: TCP
