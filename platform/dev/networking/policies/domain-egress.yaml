# 도메인 워크로드 egress 허용 (opt-in)
# - 워크로드 values의 networkEgress 목록 → Pod 라벨 egress.lookddak.com/<대상>: "true" (charts/lookddak-workload)
# - 라벨이 붙은 도메인 Pod만 해당 목적지로 나갈 수 있다. 목적지는 FQDN (baseline의 DNS 관측 규칙이 전제)
# - 새 대상: 여기 정책 추가 + scripts/validate-repository.rb 허용 목록 추가
# - 외부(메시 밖) 목적지는 ztunnel이 그대로 통과시키므로 Istio AuthorizationPolicy 영향 없음
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-egress-mysql
spec:
  description: "Dev MySQL RDS (V3 DB)"
  endpointSelector:
    matchLabels:
      egress.lookddak.com/mysql: "true"
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
        operator: Exists
  egress:
    - toFQDNs:
        - matchName: "lookddak-dev-v2-mysql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com"
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP

