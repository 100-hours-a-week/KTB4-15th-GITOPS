---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-egress-s3
spec:
  description: "Amazon S3 dev 이미지 버킷 (리전 virtual-host endpoint, Gateway Endpoint 경유)"
  endpointSelector:
    matchLabels:
      egress.lookddak.com/s3: "true"
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
        operator: Exists
  egress:
    - toFQDNs:
        # workload-iam 권한이 이 버킷뿐이다. 다른 버킷으로 나가는 경로를 네트워크에서도 막는다
        - matchName: "lookddak-dev-images-686496667254-ap-northeast-2.s3.ap-northeast-2.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

