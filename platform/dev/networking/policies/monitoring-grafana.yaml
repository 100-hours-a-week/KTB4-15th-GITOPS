apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-from-gateway
  namespace: monitoring
spec:
  description: "Grafana 3000은 공용 Gateway만 (auth.proxy 헤더 위조 방지)"
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-ingress
            k8s:gateway.networking.k8s.io/gateway-name: lookddak-gateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy-from-gateway
  namespace: monitoring
spec:
  description: "oauth2-proxy 4180은 공용 Gateway만 (ext_authz·/oauth2 경로)"
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-ingress
            k8s:gateway.networking.k8s.io/gateway-name: lookddak-gateway
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
