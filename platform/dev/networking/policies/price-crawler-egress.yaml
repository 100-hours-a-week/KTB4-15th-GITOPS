apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-price-crawler-egress
spec:
  description: "Dev price-crawler의 PostgreSQL 및 29CM 가격 조회 연결 허용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-commerce
      k8s:app.kubernetes.io/name: price-crawler
  egress:
    # Dev PostgreSQL RDS. 공통 도메인 정책의 CoreDNS 관측으로 RDS 주소 변경을 따라간다
    - toFQDNs:
        - matchName: lookddak-dev-postgresql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # 29CM 상품 페이지·BFF API
    - toFQDNs:
        - matchName: www.29cm.co.kr
        - matchName: display-bff-api.29cm.co.kr
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
