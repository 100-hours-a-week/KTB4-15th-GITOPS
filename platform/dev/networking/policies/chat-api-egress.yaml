apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-dev-chat-api-egress
spec:
  description: "Dev chat-api의 MySQL 연결 허용"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-chat
      k8s:app.kubernetes.io/name: chat-api
  egress:
    # Dev MySQL RDS(V3 DB). 공통 도메인 정책의 CoreDNS 관측으로 RDS 주소 변경을 따라간다
    - toFQDNs:
        - matchName: lookddak-dev-v2-mysql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
