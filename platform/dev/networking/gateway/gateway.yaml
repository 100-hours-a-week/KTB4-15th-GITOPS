# 공용 Istio Gateway (Gateway API)
# CloudFront(VPC Origin) → 내부 NLB(TCP 443 통과) → 이 Gateway(TLS 종료) → HTTPRoute → Service
# - istiod가 이 리소스를 보고 Deployment·Service(type: LoadBalancer)를 자동 생성한다
# - Service 어노테이션은 spec.infrastructure.annotations로 전달되고, AWS LB Controller가 내부 NLB를 만든다
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lookddak-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      # TLS는 Gateway에서 종료한다. NLB는 TCP로 통과시킨다 (ssl-cert 어노테이션 없음)
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "15021"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz/ready
      # Gateway 교체 시 기존 SSE 연결 종료 대기
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: deregistration_delay.timeout_seconds=300
      service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    parametersRef:
      group: ""
      kind: ConfigMap
      name: lookddak-gateway-options
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: dev.lookddak.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: dev-lookddak-com-tls
      # 도메인 Namespace(lookddak-*)의 HTTPRoute만 붙을 수 있다
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: lookddak.io/domain
                operator: Exists
