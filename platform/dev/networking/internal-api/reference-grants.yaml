# lookddak-web의 내부 API HTTPRoute가 이 Namespace의 Service를 backend로 쓰는 것을 허용
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-web-internal-api
  namespace: lookddak-identity
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: lookddak-web
  to:
    - group: ""
      kind: Service
---
