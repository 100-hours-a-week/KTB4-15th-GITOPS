# 내부 API 경로 표 (외부 HTTPRoute와 같은 경로, 설계 03)
# 서비스 경로를 바꾸면 각 워크로드 routing 값과 함께 여기도 바꾼다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: lookddak-web
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: api
      port: 80
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/auth}
        - path: {type: PathPrefix, value: /api/v1/members}
        - path: {type: PathPrefix, value: /api/v1/full-body-image}
      backendRefs:
        - {name: identity-api, namespace: lookddak-identity, port: 80}
    - matches:
        - path: {type: PathPrefix, value: /api/v1/chat-rooms}
      backendRefs:
        - {name: chat-api, namespace: lookddak-chat, port: 80}
    - matches:
        - path: {type: PathPrefix, value: /api/v1/products}
        - path: {type: PathPrefix, value: /api/v1/wishlists}
      backendRefs:
        - {name: commerce-api, namespace: lookddak-commerce, port: 80}
    - matches:
        - path: {type: PathPrefix, value: /api/v1/fitting-candidates}
        - path: {type: PathPrefix, value: /api/v1/fitting-jobs}
        - path: {type: PathPrefix, value: /api/v1/fitting-results}
        - path: {type: PathPrefix, value: /api/v1/notifications}
      backendRefs:
        - {name: fitting-api, namespace: lookddak-fitting, port: 80}
