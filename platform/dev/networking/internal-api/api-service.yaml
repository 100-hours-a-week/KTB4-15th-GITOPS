# web-bff의 API_BASE_URL 대상 (http://api.lookddak-web.svc.cluster.local/api/v1/)
# Pod를 선택하지 않는 이름만 있는 Service. 트래픽은 waypoint가 받아 HTTPRoute로 분기한다
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lookddak-web
  labels:
    istio.io/use-waypoint: waypoint
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      appProtocol: http
