# lookddak-web 내부 API 라우팅용 waypoint (Ambient L7)
# web-bff → Service api → waypoint(경로 분기) → 각 도메인 API. 전 구간 HBONE(mTLS)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: lookddak-web
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-options
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# istiod가 만드는 waypoint Deployment 덮어쓰기 (dev: 1개, general-purpose 노드)
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-options
  namespace: lookddak-web
data:
  deployment: |
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
