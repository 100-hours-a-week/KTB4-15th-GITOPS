# Redis Cluster 추가 설정 (k8s-design/11 §4-5)
# - 영속화 없음, 데이터 상한 350mb(Pod limit 450Mi의 약 80%), 한 샤드 장애 시 나머지 슬롯 동작
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cache-config
  namespace: lookddak-redis
data:
  redis-additional.conf: |
    appendonly no
    save ""
    maxmemory 350mb
    maxmemory-policy volatile-lru
    cluster-require-full-coverage no
    cluster-node-timeout 15000
    user be-readonly on #f1869491b42f8598d8f775e805a74134317edb3553b5709c6e70f6f3e997a885 ~* resetchannels -@all +@read +@connection +cluster|slots +cluster|shards +cluster|nodes +cluster|info -@dangerous +info
