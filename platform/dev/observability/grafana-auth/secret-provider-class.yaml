apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oauth2-proxy
  namespace: monitoring
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: /lookddak/dev/v3/monitoring/oauth2-proxy/client-secret
        objectType: ssmparameter
        objectAlias: client-secret
      - objectName: /lookddak/dev/v3/monitoring/oauth2-proxy/cookie-secret
        objectType: ssmparameter
        objectAlias: cookie-secret
