apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alloy-cluster-db-exporters
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: /lookddak/dev/v3/monitoring/mysql-exporter/password
        objectType: ssmparameter
        objectAlias: mysql-exporter-password
      - objectName: /lookddak/dev/monitoring/postgres-exporter/password
        objectType: ssmparameter
        objectAlias: postgres-exporter-password
