prometheus:
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

  configmapReload:
    prometheus:
      image:
        tag: v0.94.0

  server:
    extraFlags:
      - web.enable-lifecycle
      - web.enable-remote-write-receiver
    global:
      scrape_interval: 60s
      evaluation_interval: 60s
      external_labels:
        cluster: lookddak-dev
    retention: 7d
    retentionSize: 25GB
    strategy:
      type: Recreate
    persistentVolume:
      enabled: true
      size: 30Gi
      storageClass: gp3
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        memory: 1536Mi
    nodeSelector:
      lookddak.io/node-pool: monitoring
    tolerations:
      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule

  scrapeConfigs:
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
