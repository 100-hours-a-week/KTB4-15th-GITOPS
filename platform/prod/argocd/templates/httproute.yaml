# Argo CD UI·Webhook 외부 진입
# CloudFront → 내부 NLB → Istio Gateway(https-argocd Listener, TLS 종료) → argocd-server:80
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lookddak-gateway
      namespace: istio-ingress
      sectionName: https-argocd
  hostnames:
    - argocd.lookddak.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
