redis-operator:
  redisOperator:
    # 이미지 태그는 차트 appVersion(0.27.0)을 따른다
    imagePullPolicy: IfNotPresent
    # 감시 범위를 lookddak-redis로 한정한다 (클러스터 전체 감시 안 함)
    watchNamespace: lookddak-redis
    # 마스터·레플리카 분리용 webhook(masterSlaveAntiAffinity)은 검증 후 결정 (k8s-design/18 T1)
    webhook: false
    metrics:
      enabled: true

  # Role/RoleBinding만 만든다 (ClusterRole 없음). CRD는 클러스터 범위라 별도로 설치한다
  rbac:
    enabled: true
    scope: namespace

  # 차트 기본 500m/500Mi는 과하다. 관측 후 조정
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  replicas: 1

  # Operator는 general-purpose 노드 (Redis 전용 노드에는 Redis만)
  nodeSelector:
    lookddak.io/node-pool: general-purpose
    kubernetes.io/arch: arm64

  # Redis 설정을 Operator init container(/operator agent bootstrap)가 생성한다 (alpha)
  # - 기본(이미지 entrypoint.sh)은 cluster-announce-hostname에 짧은 Pod 이름(redis-cache-leader-0)을 넣고,
  #   ConfigMap include보다 뒤에 써서 덮어쓸 수 없다
  # - Lettuce는 CLUSTER NODES의 hostname으로 접속 → 다른 Namespace(chat-api)에서 짧은 이름이 풀리지 않아 연결 실패 (2026-11-09)
  # - 이 gate를 켜면 headless Service FQDN(<pod>.<sts>-headless.lookddak-redis.svc.cluster.local)을 알리고, ConfigMap을 맨 뒤에 include한다
  # - 지원하지 않는 gate 이름을 넣으면 Operator가 기동하지 않는다 → 차트·이미지 버전을 올릴 때 확인
  featureGates:
    GenerateConfigInInitContainer: true
