loki:
  deploymentMode: SingleBinary

  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::686496667254:role/lookddak-prod-v3-loki

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2026-11-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: lookddak-prod-v3-loki-686496667254-ap-northeast-2
        ruler: lookddak-prod-v3-loki-686496667254-ap-northeast-2
      s3:
        region: ap-northeast-2
    compactor:
      retention_enabled: true
      delete_request_store: s3
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true
      volume_enabled: true
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 8
      max_query_parallelism: 4
    pattern_ingester:
      enabled: false
    ingester:
      chunk_encoding: snappy
    querier:
      max_concurrent: 2

  singleBinary:
    replicas: 1
    priorityClassName: lookddak-monitoring-storage
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: true
      size: 10Gi
      storageClass: gp3
    nodeSelector:
      lookddak.io/node-pool: monitoring
    tolerations:
      - key: dedicated
        operator: Equal
        value: monitoring
        effect: NoSchedule

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  gateway:
    enabled: false
  ruler:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  minio:
    enabled: false
