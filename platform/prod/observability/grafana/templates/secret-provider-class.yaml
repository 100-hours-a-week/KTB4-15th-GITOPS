apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-redis-readonly
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: /lookddak/prod/v3/monitoring/grafana/redis-readonly-password
        objectType: ssmparameter
        objectAlias: password
