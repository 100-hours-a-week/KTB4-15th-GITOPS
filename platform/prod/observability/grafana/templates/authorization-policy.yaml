apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: grafana-from-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-ingress/sa/lookddak-gateway-istio
      to:
        - operation:
            ports:
              - "3000"
