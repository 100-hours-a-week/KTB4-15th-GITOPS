apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lookddak-gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internal
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "15021"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz/ready
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: deregistration_delay.timeout_seconds=300
      service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
      # CloudFront(origin-facing)에서 오는 443만 허용하는 SG (KTB4-15th-CLOUD prod/v3/edge)
      service.beta.kubernetes.io/aws-load-balancer-security-groups: sg-0993a57cec9f3b5f5
      # Pod 쪽 SG의 NLB → Pod·Health Check 규칙은 AWS LB Controller가 관리한다
      service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
    parametersRef:
      group: ""
      kind: ConfigMap
      name: lookddak-gateway-options
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: lookddak.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: lookddak-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: lookddak.com/domain
                operator: Exists
    - name: https-www
      port: 443
      protocol: HTTPS
      hostname: www.lookddak.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: lookddak-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: lookddak.com/domain
                operator: Exists
    - name: https-argocd
      port: 443
      protocol: HTTPS
      hostname: argocd.lookddak.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: lookddak-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
