apiVersion: v1
kind: ConfigMap
metadata:
  name: lookddak-gateway-options
  namespace: istio-ingress
data:
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          nodeSelector:
            kubernetes.io/os: linux
            kubernetes.io/arch: arm64
            lookddak.io/node-pool: general-purpose
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: lookddak-gateway
          terminationGracePeriodSeconds: 330
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
  service: |
    spec:
      ports:
        - "$patch": delete
          port: 15021
  podDisruptionBudget: |
    spec:
      minAvailable: 1
