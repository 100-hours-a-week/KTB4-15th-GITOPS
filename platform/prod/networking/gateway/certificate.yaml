apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lookddak-com
  namespace: istio-ingress
spec:
  secretName: lookddak-com-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - lookddak.com
    - www.lookddak.com
    - v3-prod.lookddak.com
    - argocd.lookddak.com
