apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata: {name: lookddak-prod-chat-ai-egress}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-chat
      k8s:app.kubernetes.io/name: chat-ai
  egress:
    - toFQDNs: [{matchName: lookddak-prod-v2-postgresql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com}]
      toPorts: [{ports: [{port: "5432", protocol: TCP}]}]
    - toFQDNs:
        - {matchName: api.runware.ai}
        - {matchName: api.openai.com}
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
