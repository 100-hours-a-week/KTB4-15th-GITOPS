# 도메인 Namespace 내부 HBONE 통신 허용 (Namespace마다 1개)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-prod-web-same-namespace
spec:
  endpointSelector:
    matchLabels: {"k8s:io.kubernetes.pod.namespace": lookddak-web}
  ingress:
    - fromEndpoints:
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": lookddak-web}
      toPorts: [{ports: [{port: "15008", protocol: TCP}]}]
  egress:
    - toEndpoints:
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": lookddak-web}
      toPorts: [{ports: [{port: "15008", protocol: TCP}]}]
---
