apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata: {name: lookddak-prod-body-image-validator-egress}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-identity
      k8s:app.kubernetes.io/name: body-image-validator
  egress:
    - toFQDNs: [{matchName: lookddak--lookddak-body-image.us-east.modal.run}]
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
    - toFQDNs:
        - {matchName: sts.ap-northeast-2.amazonaws.com}
        - {matchName: sts.amazonaws.com}
        - {matchName: lookddak-prod-images-686496667254-ap-northeast-2.s3.ap-northeast-2.amazonaws.com}
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
