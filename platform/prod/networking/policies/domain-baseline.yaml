# Prod 도메인 Namespace 공통 정책 (기본 차단 + 공통 허용)
# Ambient Pod 통신은 HBONE(15008), 외부 목적지는 워크로드별 FQDN 정책으로만 연다.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-prod-domain-baseline
spec:
  description: "Prod 도메인 Namespace 기본 차단, Ambient probe·Gateway·DNS 허용"
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
        operator: Exists
  ingress:
    - fromCIDR:
        - 169.254.7.127/32
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-ingress
            gateway.networking.k8s.io/gateway-name: lookddak-gateway
      toPorts:
        - ports:
            - port: "15008"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
