apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata: {name: lookddak-prod-fitting-worker-egress}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-fitting
      k8s:app.kubernetes.io/name: fitting-worker
  egress:
    - toFQDNs: [{matchName: lookddak-prod-v2-mysql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com}]
      toPorts: [{ports: [{port: "3306", protocol: TCP}]}]
    - toFQDNs:
        - {matchName: sts.ap-northeast-2.amazonaws.com}
        - {matchName: sts.amazonaws.com}
        - {matchName: sqs.ap-northeast-2.amazonaws.com}
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
