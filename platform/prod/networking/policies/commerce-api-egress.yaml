apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata: {name: lookddak-prod-commerce-api-egress}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-commerce
      k8s:app.kubernetes.io/name: commerce-api
  egress:
    - toFQDNs: [{matchName: lookddak-prod-v2-mysql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com}]
      toPorts: [{ports: [{port: "3306", protocol: TCP}]}]
