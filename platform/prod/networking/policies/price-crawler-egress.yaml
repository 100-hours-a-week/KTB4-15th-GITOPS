apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata: {name: lookddak-prod-price-crawler-egress}
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-commerce
      k8s:app.kubernetes.io/name: price-crawler
  egress:
    - toFQDNs: [{matchName: lookddak-prod-v2-postgresql.cd8ekqeiua7b.ap-northeast-2.rds.amazonaws.com}]
      toPorts: [{ports: [{port: "5432", protocol: TCP}]}]
    - toFQDNs:
        - {matchName: www.29cm.co.kr}
        - {matchName: display-bff-api.29cm.co.kr}
      toPorts: [{ports: [{port: "443", protocol: TCP}]}]
