apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-prod-web-waypoint-egress
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: lookddak-web
      gateway.networking.k8s.io/gateway-name: waypoint
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts: [{ports: [{port: "15012", protocol: TCP}]}]
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
              operator: Exists
      toPorts: [{ports: [{port: "15008", protocol: TCP}]}]
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: lookddak-prod-domain-from-web-waypoint
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.lookddak.com/domain
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lookddak-web
            gateway.networking.k8s.io/gateway-name: waypoint
      toPorts: [{ports: [{port: "15008", protocol: TCP}]}]
