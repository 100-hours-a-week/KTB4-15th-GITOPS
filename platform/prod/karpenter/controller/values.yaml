karpenter:
  settings:
    clusterName: lookddak-prod
    interruptionQueue: ""
    enableZonalShift: false

  serviceAccount:
    create: true
    name: karpenter
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::686496667254:role/lookddak-prod-karpenter-controller

  replicas: 2

  nodeSelector:
    kubernetes.io/os: linux
    lookddak.io/node-pool: system

  tolerations:
    - key: CriticalAddonsOnly
      operator: Equal
      value: "true"
      effect: NoSchedule

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  serviceMonitor:
    enabled: false

  logLevel: info
