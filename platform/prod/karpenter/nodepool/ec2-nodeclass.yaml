apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: general-purpose
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  amiSelectorTerms:
    - alias: al2023@v20261031
  instanceProfile: lookddak-prod-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: lookddak-prod
        Tier: private-node
  securityGroupSelectorTerms:
    - id: sg-041f092dc1698a99a
  associatePublicIPAddress: false
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 30Gi
        encrypted: true
        deleteOnTermination: true
  tags:
    Name: lookddak-prod-general-purpose
    Project: lookddak
    Environment: prod
    Version: v3
    NodePool: general-purpose
    ManagedBy: karpenter
