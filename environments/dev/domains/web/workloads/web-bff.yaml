gitops:
  autoSync: true

workload:
  name: web-bff
  type: deployment

imageGroup: fe

container:
  port: 3000

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

service:
  enabled: true
  port: 3000

routing:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
