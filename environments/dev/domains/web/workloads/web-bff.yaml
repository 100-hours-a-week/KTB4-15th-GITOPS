gitops:
  # GitOps main 변경은 GitHub Webhook으로 즉시 감지하고, 주기적 polling은 fallback으로 유지한다.
  autoSync: true

workload:
  name: web-bff
  type: deployment

imageGroup: fe

container:
  port: 3000
  env:
    # 서버(SSR)가 BE API를 호출하는 내부 기본 주소다.
    # lookddak-web의 waypoint가 경로를 보고 identity·chat·commerce·fitting API로 나눈다
    # (platform/dev/networking/internal-api)
    - name: API_BASE_URL
      value: http://api.lookddak-web.svc.cluster.local/api/v1/

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

service:
  enabled: true
  port: 3000

routing:
  enabled: true
  # 공용 Gateway의 V3 검증 Listener (V2 → V3 전환 시 https / dev.lookddak.com 추가)
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lookddak-gateway
      namespace: istio-ingress
      sectionName: https-v3-dev
  hostnames:
    - v3-dev.lookddak.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true

tracing:
  enabled: true
  runtime: nodejs
  resourceAttributes: deployment.environment.name=dev,service.namespace=lookddak
