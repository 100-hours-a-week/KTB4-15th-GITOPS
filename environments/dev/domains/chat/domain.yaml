# Values for the lookddak-chat namespace. Policy values are not finalized yet.
resourceQuota:
  enabled: false
  hard: {}
limitRange:
  enabled: false
  limits: []
networkPolicy:
  enabled: false
ciliumNetworkPolicy:
  enabled: false
authorizationPolicy:
  enabled: true
  workloadIngress:
    - name: allow-web-bff-to-chat-api
      targetWorkload: chat-api
      sourcePrincipal: cluster.local/ns/lookddak-web/sa/web-bff
      targetPort: "8080"
