gitops:
  autoSync: true

workload:
  name: chat-ai
  type: deployment
  runtimeRole: chat-ai

imageGroup: ai

container:
  port: 8000
  env:
    - name: AWS_REGION
      value: ap-northeast-2
    # Chat 전용 Pod에서는 공용 이미지의 무거운 로컬 전신 이미지 모델을 올리지 않는다.
    - name: BODY_IMAGE_VALIDATION_MODE
      value: remote
    # 공용 AI 이미지에 포함된 가상피팅 백그라운드 작업은 Chat Pod에서 실행하지 않는다.
    - name: VIRTUAL_FITTING_REQUEST_WORKER_ENABLED
      value: "false"
    - name: VIRTUAL_FITTING_POSTPROCESS_WORKER_ENABLED
      value: "false"
    - name: VIRTUAL_FITTING_RESULT_PUBLISHER_ENABLED
      value: "false"
    - name: VIRTUAL_FITTING_WATCHDOG_ENABLED
      value: "false"

replicaCount: 2

deployment:
  terminationGracePeriodSeconds: 120

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

service:
  enabled: true
  port: 80

autoscaling:
  enabled: false

pdb:
  enabled: true
  maxUnavailable: 1

routing:
  enabled: false

serviceAccount:
  create: true
  roleArn: arn:aws:iam::686496667254:role/lookddak-dev-v3-chat-ai

secrets:
  enabled: true
  rolloutOnChange: true
  secretProviderClassName: chat-ai
  mountPath: /mnt/secrets-store
  parameters:
    objects: |
      - objectName: /lookddak/dev/v3/postgresql/app/database-url
        objectType: ssmparameter
        objectAlias: DATABASE_URL
      - objectName: /lookddak/dev/v3/postgresql/app/checkpoint-dsn
        objectType: ssmparameter
        objectAlias: CHECKPOINT_DSN
      - objectName: /lookddak/dev/internal/ai-api-key
        objectType: ssmparameter
        objectAlias: INTERNAL_API_KEY
      - objectName: /lookddak/dev/fastapi/runware-llm-api-key
        objectType: ssmparameter
        objectAlias: RUNWARE_LLM_API_KEY
      # 공용 AI 이미지의 시작 검증 때문에 Chat 경로에서 직접 쓰지 않아도 필요하다.
      - objectName: /lookddak/dev/fastapi/runware-vton-api-key
        objectType: ssmparameter
        objectAlias: RUNWARE_VTON_API_KEY
      - objectName: /lookddak/dev/fastapi/openAI-api-key
        objectType: ssmparameter
        objectAlias: OPENAI_API_KEY
  startup:
    enabled: true
    environment:
      - name: DATABASE_URL
        fileName: DATABASE_URL
      - name: CHECKPOINT_DSN
        fileName: CHECKPOINT_DSN
      - name: INTERNAL_API_KEY
        fileName: INTERNAL_API_KEY
      - name: RUNWARE_LLM_API_KEY
        fileName: RUNWARE_LLM_API_KEY
      - name: RUNWARE_VTON_API_KEY
        fileName: RUNWARE_VTON_API_KEY
      - name: OPENAI_API_KEY
        fileName: OPENAI_API_KEY
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

tracing:
  enabled: true
  runtime: python
  resourceAttributes: deployment.environment.name=dev,service.namespace=lookddak
