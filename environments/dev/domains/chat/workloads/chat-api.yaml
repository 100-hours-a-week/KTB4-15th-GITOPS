gitops:
  autoSync: false

workload:
  name: chat-api
  type: deployment
  runtimeRole: chat-api

imageGroup: be

service:
  enabled: true

routing:
  enabled: true
  # 공용 Gateway의 V3 검증 Listener (V2 → V3 전환 시 https / dev.lookddak.com 추가)
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lookddak-gateway
      namespace: istio-ingress
      sectionName: https-v3-dev
  hostnames:
    - v3-dev.lookddak.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/chat-rooms

serviceAccount:
  create: true
  roleArn: arn:aws:iam::686496667254:role/lookddak-dev-v3-chat-api

# 도메인 밖 egress (platform/dev/networking/policies/domain-egress.yaml)
networkEgress:
  - mysql
