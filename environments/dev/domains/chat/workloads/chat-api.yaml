gitops:
  autoSync: true

workload:
  name: chat-api
  type: deployment
  runtimeRole: chat-api

imageGroup: be

container:
  port: 8080
  env:
    # chat-api profile은 BE application-chat-api.yaml의 Redis Cluster 설정을 켠다. 다른 BE workload는 prod만 사용한다.
    - name: SPRING_PROFILES_ACTIVE
      value: prod,chat-api
    - name: AWS_REGION
      value: ap-northeast-2
    # 공용 Spring 이미지의 필수 설정 검증을 통과시키되 Chat에는 S3 IAM 권한을 주지 않는다.
    - name: AWS_S3_BUCKET
      value: lookddak-dev-images-686496667254-ap-northeast-2
    - name: AI_SERVER_URL
      value: http://chat-ai:80
    - name: CORS_ALLOWED_ORIGINS
      value: https://v3-dev.lookddak.com
    - name: SENTRY_ENVIRONMENT
      value: dev
    - name: SSE_SERVER_PORT
      value: "8081"
    # Dev Redis Cluster의 leader Service를 seed endpoint로 사용한다.
    # BE는 spring.data.redis.cluster.nodes(REDIS_CLUSTER_NODES)로 Cluster 모드 접속하고 MOVED·토폴로지 갱신을 처리한다.
    - name: REDIS_CLUSTER_NODES
      value: redis-cache-master.lookddak-redis.svc.cluster.local:6379
    - name: CHAT_REDIS_ENABLED
      value: "true"
    # Redis 장애 시 local/DB fallback으로 서비스하므로 readiness에서 Redis를 제외한다.
    - name: MANAGEMENT_HEALTH_REDIS_ENABLED
      value: "false"
    - name: SPRING_AUTOCONFIGURE_EXCLUDE
      value: org.springframework.boot.data.redis.autoconfigure.observation.LettuceObservationAutoConfiguration
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=25.0
        -XX:MaxMetaspaceSize=256m
        -XX:+UseContainerSupport
        -Dnetworkaddress.cache.ttl=10

replicaCount: 2

deployment:
  terminationGracePeriodSeconds: 330

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

probes:
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

service:
  enabled: true
  port: 80

autoscaling:
  enabled: false

pdb:
  enabled: true
  maxUnavailable: 1

routing:
  enabled: true
  # 공용 Gateway의 V3 검증 Listener (V2 → V3 전환 시 https / dev.lookddak.com 추가)
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lookddak-gateway
      namespace: istio-ingress
      sectionName: https-v3-dev
  hostnames:
    - v3-dev.lookddak.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/chat-rooms

serviceAccount:
  create: true
  roleArn: arn:aws:iam::686496667254:role/lookddak-dev-v3-chat-api

secrets:
  enabled: true
  secretProviderClassName: chat-api
  mountPath: /mnt/secrets-store
  parameters:
    objects: |
      - objectName: /lookddak/dev/v3/mysql/jdbc-url
        objectType: ssmparameter
        objectAlias: DB_URL
      - objectName: /lookddak/dev/v3/mysql/app/username
        objectType: ssmparameter
        objectAlias: DB_USERNAME
      - objectName: /lookddak/dev/v3/mysql/app/password
        objectType: ssmparameter
        objectAlias: DB_PASSWORD
      - objectName: /lookddak/dev/spring/jwt-secret
        objectType: ssmparameter
        objectAlias: JWT_SECRET
      - objectName: /lookddak/dev/internal/ai-api-key
        objectType: ssmparameter
        objectAlias: AI_INTERNAL_API_KEY
  startup:
    enabled: true
    environment:
      - name: DB_URL
        fileName: DB_URL
      - name: DB_USERNAME
        fileName: DB_USERNAME
      - name: DB_PASSWORD
        fileName: DB_PASSWORD
      - name: JWT_SECRET
        fileName: JWT_SECRET
      - name: AI_INTERNAL_API_KEY
        fileName: AI_INTERNAL_API_KEY
    command:
      - java
      - -XX:+ExitOnOutOfMemoryError
      - org.springframework.boot.loader.launch.JarLauncher

tracing:
  enabled: true
  runtime: java
  resourceAttributes: deployment.environment.name=dev,service.namespace=lookddak
  env:
    - name: OTEL_INSTRUMENTATION_LETTUCE_QUERY_SANITIZATION_ENABLED
      value: "false"
