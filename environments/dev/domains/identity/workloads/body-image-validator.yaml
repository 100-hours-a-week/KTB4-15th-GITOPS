gitops:
  autoSync: true

workload:
  name: body-image-validator
  type: deployment
  runtimeRole: body-image-validator

imageGroup: ai

container:
  port: 8000
  env:
    - name: BODY_IMAGE_VALIDATION_MODE
      value: remote
    # 공용 이미지에서 전신 이미지 검증에 필요 없는 가상피팅 백그라운드 작업을 끈다.
    - name: VIRTUAL_FITTING_REQUEST_WORKER_ENABLED
      value: "false"
    - name: VIRTUAL_FITTING_POSTPROCESS_WORKER_ENABLED
      value: "false"
    - name: VIRTUAL_FITTING_RESULT_PUBLISHER_ENABLED
      value: "false"
    - name: VIRTUAL_FITTING_WATCHDOG_ENABLED
      value: "false"

replicaCount: 2

deployment:
  terminationGracePeriodSeconds: 120

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "1"
    memory: 2Gi

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

service:
  enabled: true
  port: 80

autoscaling:
  enabled: false

pdb:
  enabled: true
  maxUnavailable: 1

routing:
  enabled: false

serviceAccount:
  create: true
  roleArn: arn:aws:iam::686496667254:role/lookddak-dev-v3-body-image-validator

secrets:
  enabled: true
  secretProviderClassName: body-image-validator
  mountPath: /mnt/secrets-store
  parameters:
    objects: |
      - objectName: /lookddak/dev/internal/ai-api-key
        objectType: ssmparameter
        objectAlias: INTERNAL_API_KEY
      - objectName: /lookddak/dev/fastapi/body-image-validation/url
        objectType: ssmparameter
        objectAlias: BODY_IMAGE_REMOTE_URL
      - objectName: /lookddak/dev/fastapi/body-image-validation/proxy-key
        objectType: ssmparameter
        objectAlias: BODY_IMAGE_REMOTE_PROXY_KEY
      - objectName: /lookddak/dev/fastapi/body-image-validation/proxy-secret
        objectType: ssmparameter
        objectAlias: BODY_IMAGE_REMOTE_PROXY_SECRET
      - objectName: /lookddak/dev/fastapi/body-image-validation/api-key
        objectType: ssmparameter
        objectAlias: BODY_IMAGE_REMOTE_API_KEY
      - objectName: /lookddak/dev/fastapi/runware-vton-api-key
        objectType: ssmparameter
        objectAlias: RUNWARE_VTON_API_KEY
      - objectName: /lookddak/dev/fastapi/runware-llm-api-key
        objectType: ssmparameter
        objectAlias: RUNWARE_LLM_API_KEY
  startup:
    enabled: true
    environment:
      - name: INTERNAL_API_KEY
        fileName: INTERNAL_API_KEY
      - name: BODY_IMAGE_REMOTE_URL
        fileName: BODY_IMAGE_REMOTE_URL
      - name: BODY_IMAGE_REMOTE_PROXY_KEY
        fileName: BODY_IMAGE_REMOTE_PROXY_KEY
      - name: BODY_IMAGE_REMOTE_PROXY_SECRET
        fileName: BODY_IMAGE_REMOTE_PROXY_SECRET
      - name: BODY_IMAGE_REMOTE_API_KEY
        fileName: BODY_IMAGE_REMOTE_API_KEY
      - name: RUNWARE_VTON_API_KEY
        fileName: RUNWARE_VTON_API_KEY
      - name: RUNWARE_LLM_API_KEY
        fileName: RUNWARE_LLM_API_KEY
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
