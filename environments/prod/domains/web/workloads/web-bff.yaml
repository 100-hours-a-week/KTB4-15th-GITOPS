workload:
  name: web-bff
  type: deployment

imageGroup: fe

container:
  port: 3000
  env:
    - name: API_BASE_URL
      value: http://api.lookddak-web.svc.cluster.local/api/v1/
    - name: NODE_ENV
      value: production
    - name: TZ
      value: Asia/Seoul
    - name: NODE_OPTIONS
      value: --max-old-space-size=384

replicaCount: 2

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  startup:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

scheduling:
  nodeSelector:
    kubernetes.io/arch: arm64
    lookddak.io/node-pool: general-purpose
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

service:
  enabled: true
  # Service는 표준 HTTP 80을 노출하고 Pod의 이름 있는 http 포트(3000)로 전달한다.
  port: 80

routing:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lookddak-gateway
      namespace: istio-ingress
      sectionName: https-v3-prod
  hostnames:
    - v3-prod.lookddak.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
