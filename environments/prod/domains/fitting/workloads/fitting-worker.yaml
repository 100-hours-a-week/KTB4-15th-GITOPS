workload:
  name: fitting-worker
  type: deployment
  runtimeRole: fitting-worker

imageGroup: be

container:
  port: 8080
  env:
    - {name: SPRING_PROFILES_ACTIVE, value: prod}
    - {name: TZ, value: Asia/Seoul}
    - {name: AWS_REGION, value: ap-northeast-2}
    - {name: AWS_S3_BUCKET, value: lookddak-prod-images-686496667254-ap-northeast-2}
    - {name: AI_SERVER_URL, value: "http://vton-orchestrator:80"}
    - {name: CORS_ALLOWED_ORIGINS, value: "https://lookddak.com,https://www.lookddak.com,https://v3-prod.lookddak.com"}
    - {name: SENTRY_ENVIRONMENT, value: prod}
    - {name: SSE_SERVER_PORT, value: "8081"}
    - {name: FITTING_OUTBOX_ENABLED, value: "true"}
    - {name: FITTING_RESULT_CONSUMER_ENABLED, value: "true"}
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=25.0
        -XX:MaxMetaspaceSize=256m
        -XX:+UseContainerSupport
        -Dnetworkaddress.cache.ttl=10

replicaCount: 2
deployment: {terminationGracePeriodSeconds: 120}

scheduling:
  nodeSelector: {kubernetes.io/arch: arm64, lookddak.io/node-pool: general-purpose}
  topologySpreadConstraints:
    - {maxSkew: 1, minDomains: 2, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule}
    - {maxSkew: 1, minDomains: 2, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule}

resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {cpu: "1", memory: 2Gi}

probes:
  startup:
    httpGet: {path: /actuator/health/liveness, port: http}
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    httpGet: {path: /actuator/health/liveness, port: http}
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet: {path: /actuator/health/readiness, port: http}
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

service: {enabled: false}
autoscaling: {enabled: false}
pdb: {enabled: true, maxUnavailable: 1}
routing: {enabled: false}

serviceAccount:
  create: true
  roleArn: arn:aws:iam::686496667254:role/lookddak-prod-v3-fitting-worker

secrets:
  enabled: true
  rolloutOnChange: true
  secretProviderClassName: fitting-worker
  mountPath: /mnt/secrets-store
  parameters:
    objects: |
      - objectName: /lookddak/prod/v3/mysql/jdbc-url
        objectType: ssmparameter
        objectAlias: DB_URL
      - objectName: /lookddak/prod/v3/mysql/app/username
        objectType: ssmparameter
        objectAlias: DB_USERNAME
      - objectName: /lookddak/prod/v3/mysql/app/password
        objectType: ssmparameter
        objectAlias: DB_PASSWORD
      - objectName: /lookddak/prod/spring/jwt-secret
        objectType: ssmparameter
        objectAlias: JWT_SECRET
      - objectName: /lookddak/prod/v3/sqs/be-fitting-request/url
        objectType: ssmparameter
        objectAlias: BE_FITTING_REQUEST_QUEUE_URL
      - objectName: /lookddak/prod/v3/sqs/be-fitting-response/url
        objectType: ssmparameter
        objectAlias: BE_FITTING_RESPONSE_QUEUE_URL
  startup:
    enabled: true
    environment:
      - {name: DB_URL, fileName: DB_URL}
      - {name: DB_USERNAME, fileName: DB_USERNAME}
      - {name: DB_PASSWORD, fileName: DB_PASSWORD}
      - {name: JWT_SECRET, fileName: JWT_SECRET}
      - {name: BE_FITTING_REQUEST_QUEUE_URL, fileName: BE_FITTING_REQUEST_QUEUE_URL}
      - {name: BE_FITTING_RESPONSE_QUEUE_URL, fileName: BE_FITTING_RESPONSE_QUEUE_URL}
    command: [java, "-XX:+ExitOnOutOfMemoryError", org.springframework.boot.loader.launch.JarLauncher]

tracing:
  enabled: true
  runtime: java
  resourceAttributes: deployment.environment.name=prod,service.namespace=lookddak
