workload:
  name: chat-api
  type: deployment
  runtimeRole: chat-api

imageGroup: be

container:
  port: 8080
  env:
    # Redis Cluster가 구축되기 전에는 기존 로컬 SSE·DB fallback 경로를 사용한다.
    - {name: SPRING_PROFILES_ACTIVE, value: prod}
    - {name: TZ, value: Asia/Seoul}
    - {name: AWS_REGION, value: ap-northeast-2}
    - {name: AWS_S3_BUCKET, value: lookddak-prod-images-686496667254-ap-northeast-2}
    - {name: AI_SERVER_URL, value: "http://chat-ai:80"}
    - {name: CORS_ALLOWED_ORIGINS, value: "https://v3-prod.lookddak.com"}
    - {name: SENTRY_ENVIRONMENT, value: prod}
    - {name: SSE_SERVER_PORT, value: "8081"}
    - {name: CHAT_REDIS_ENABLED, value: "false"}
    - {name: MANAGEMENT_HEALTH_REDIS_ENABLED, value: "false"}
    - name: JAVA_TOOL_OPTIONS
      value: >-
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=25.0
        -XX:MaxMetaspaceSize=256m
        -XX:+UseContainerSupport
        -Dnetworkaddress.cache.ttl=10

replicaCount: 2

deployment:
  terminationGracePeriodSeconds: 330

scheduling:
  nodeSelector:
    kubernetes.io/arch: arm64
    lookddak.io/node-pool: general-purpose
  topologySpreadConstraints:
    - {maxSkew: 1, minDomains: 2, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule}
    - {maxSkew: 1, minDomains: 2, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule}

resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {cpu: "1", memory: 2Gi}

probes:
  startup:
    httpGet: {path: /actuator/health/liveness, port: http}
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    httpGet: {path: /actuator/health/liveness, port: http}
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet: {path: /actuator/health/readiness, port: http}
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

service: {enabled: true, port: 80}
autoscaling: {enabled: false}
pdb: {enabled: true, maxUnavailable: 1}

routing:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lookddak-gateway
      namespace: istio-ingress
      sectionName: https-v3-prod
  hostnames: [v3-prod.lookddak.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/chat-rooms}
      timeouts: {request: 0s}

serviceAccount:
  create: true
  roleArn: arn:aws:iam::686496667254:role/lookddak-prod-v3-chat-api

secrets:
  enabled: true
  rolloutOnChange: true
  secretProviderClassName: chat-api
  mountPath: /mnt/secrets-store
  parameters:
    objects: |
      - objectName: /lookddak/prod/v3/mysql/jdbc-url
        objectType: ssmparameter
        objectAlias: DB_URL
      - objectName: /lookddak/prod/v3/mysql/app/username
        objectType: ssmparameter
        objectAlias: DB_USERNAME
      - objectName: /lookddak/prod/v3/mysql/app/password
        objectType: ssmparameter
        objectAlias: DB_PASSWORD
      - objectName: /lookddak/prod/spring/jwt-secret
        objectType: ssmparameter
        objectAlias: JWT_SECRET
      - objectName: /lookddak/prod/internal/ai-api-key
        objectType: ssmparameter
        objectAlias: AI_INTERNAL_API_KEY
  startup:
    enabled: true
    environment:
      - {name: DB_URL, fileName: DB_URL}
      - {name: DB_USERNAME, fileName: DB_USERNAME}
      - {name: DB_PASSWORD, fileName: DB_PASSWORD}
      - {name: JWT_SECRET, fileName: JWT_SECRET}
      - {name: AI_INTERNAL_API_KEY, fileName: AI_INTERNAL_API_KEY}
    command: [java, "-XX:+ExitOnOutOfMemoryError", org.springframework.boot.loader.launch.JarLauncher]
