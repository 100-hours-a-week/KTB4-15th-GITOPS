workload:
  name: identity-api
  type: deployment
  runtimeRole: identity-api

imageGroup: be

service:
  enabled: true
  port: 80

routing:
  enabled: true
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: lookddak-gateway, namespace: istio-ingress, sectionName: https-v3-prod}
  hostnames: [v3-prod.lookddak.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/auth}
        - path: {type: PathPrefix, value: /api/v1/members}
        - path: {type: PathPrefix, value: /api/v1/full-body-image}

serviceAccount:
  create: true
