# Namespace-wide resource budgets will be enabled after workload requests,
# limits, and maximum replica counts are validated by load testing.
resourceQuota:
  enabled: false
  hard: {}

# Namespace-wide defaults and constraints will be enabled after workload
# resource sizing is finalized.
limitRange:
  enabled: false
  limits: []

# Network policies stay disabled until Cilium, Istio Ambient, probes, DNS,
# observability, AWS services, and external FQDN flows are confirmed.
networkPolicy:
  enabled: false

ciliumNetworkPolicy:
  enabled: false

# Istio Ambient 인가 기본값: 같은 Namespace + 공용 Gateway만 허용 (ztunnel L4)
# Cilium 정책(platform/dev/networking/policies)과 겹쳐 두 겹으로 막는다
authorizationPolicy:
  enabled: false
  gatewayPrincipals:
    - cluster.local/ns/istio-ingress/sa/lookddak-gateway-istio
  # 서비스 계정과 대상 워크로드·포트를 지정한 추가 허용 규칙이다.
  workloadIngress: []
