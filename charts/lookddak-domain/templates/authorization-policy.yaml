{{/*
Istio Ambient 인가 기본값 (ztunnel, L4).
ALLOW 정책이 하나라도 있으면 매칭되지 않는 요청은 거부된다 → 같은 Namespace와 공용 Gateway만 허용.
경로·메서드 등 L7 조건은 waypoint 없이는 거부로 처리되므로 여기에 쓰지 않는다.
다른 Namespace 호출·포트 제한은 서비스별 정책으로 추가한다.
*/}}
{{- if .Values.authorizationPolicy.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookddak-domain.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lookddak-domain.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- toYaml .Values.authorizationPolicy.gatewayPrincipals | nindent 14 }}
{{- end }}
