{{- if eq .Values.workload.type "deployment" }}
{{- include "lookddak-workload.validateTracing" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lookddak-workload.name" . }}
  labels:
    {{- include "lookddak-workload.labels" . | nindent 4 }}
spec:
  {{- with .Values.deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ required "replicaCount is required when autoscaling is disabled" .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lookddak-workload.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lookddak-workload.labels" . | nindent 8 }}
      {{- if and .Values.secrets.enabled .Values.secrets.rolloutOnChange }}
      annotations:
        checksum/lookddak-secret-config: {{ (dict "parameters" .Values.secrets.parameters "startup" .Values.secrets.startup) | toJson | sha256sum | quote }}
      {{- end }}
    spec:
      {{- if ne .Values.deployment.terminationGracePeriodSeconds nil }}
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- omit . "labelSelector" | toYaml | nindent 10 }}
          labelSelector:
            matchLabels:
              {{- include "lookddak-workload.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "lookddak-workload.serviceAccountName" . }}
      {{- if .Values.tracing.enabled }}
      {{- $agent := index .Values.tracing.agents .Values.tracing.runtime }}
      initContainers:
        - name: otel-init
          image: {{ required "tracing agent image is required" $agent.image | quote }}
          command:
            {{- toYaml $agent.command | nindent 12 }}
          {{- with .Values.tracing.initResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      {{- end }}
      containers:
        - name: {{ include "lookddak-workload.name" . }}
          image: {{ include "lookddak-workload.image" . | quote }}
          {{- if .Values.secrets.startup.enabled }}
          command:
            - /bin/sh
            - {{ printf "%s/load-secrets.sh" .Values.secrets.startup.scriptMountPath | quote }}
          args:
            {{- range .Values.secrets.startup.environment }}
            - {{ printf "%s=%s/%s" .name $.Values.secrets.mountPath .fileName | quote }}
            {{- end }}
            - "--"
            {{- toYaml .Values.secrets.startup.command | nindent 12 }}
          {{- else }}
          {{- with .Values.container.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.container.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.container.port }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          {{- end }}
          {{- if or .Values.workload.runtimeRole .Values.container.env .Values.tracing.enabled }}
          env:
            {{- if .Values.workload.runtimeRole }}
            - name: LOOKDDAK_RUNTIME_ROLE
              value: {{ .Values.workload.runtimeRole | quote }}
            {{- end }}
            {{- with .Values.container.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            {{- include "lookddak-workload.tracingEnv" . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.secrets.enabled .Values.tracing.enabled }}
          volumeMounts:
            {{- if .Values.tracing.enabled }}
            - name: otel-agent
              mountPath: /otel
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.enabled }}
            - name: secrets-store-inline
              mountPath: {{ required "secrets.mountPath is required when secrets are enabled" .Values.secrets.mountPath | quote }}
              readOnly: true
            {{- if .Values.secrets.startup.enabled }}
            - name: secret-startup-script
              mountPath: {{ .Values.secrets.startup.scriptMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or .Values.secrets.enabled .Values.tracing.enabled }}
      volumes:
        {{- if .Values.tracing.enabled }}
        - name: otel-agent
          emptyDir:
            sizeLimit: 256Mi
        {{- end }}
        {{- if .Values.secrets.enabled }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "secrets.secretProviderClassName is required when secrets are enabled" .Values.secrets.secretProviderClassName | quote }}
        {{- if .Values.secrets.startup.enabled }}
        - name: secret-startup-script
          configMap:
            name: {{ include "lookddak-workload.secretStartupConfigMapName" . }}
            defaultMode: 0555
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
