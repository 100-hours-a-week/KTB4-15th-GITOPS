{{- if .Values.trafficPolicy.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "service.enabled must be true when trafficPolicy is enabled" }}
{{- end }}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ include "lookddak-workload.name" . }}
  labels:
    {{- include "lookddak-workload.labels" . | nindent 4 }}
spec:
  host: {{ printf "%s.%s.svc.cluster.local" (include "lookddak-workload.name" .) .Release.Namespace }}
  trafficPolicy:
    {{- with .Values.trafficPolicy.connectionPool }}
    connectionPool:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.trafficPolicy.outlierDetection }}
    outlierDetection:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
