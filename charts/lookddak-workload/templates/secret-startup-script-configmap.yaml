{{- include "lookddak-workload.validateSecretStartup" . -}}
{{- if .Values.secrets.startup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lookddak-workload.secretStartupConfigMapName" . }}
  labels:
    {{- include "lookddak-workload.labels" . | nindent 4 }}
data:
  load-secrets.sh: |
    #!/bin/sh
    set -eu

    # "환경변수=파일 경로" 인자를 읽되 Secret 값은 출력하지 않는다.
    while [ "$#" -gt 0 ] && [ "$1" != "--" ]; do
      mapping="$1"
      variable_name="${mapping%%=*}"
      secret_file="${mapping#*=}"

      if [ "$variable_name" = "$mapping" ]; then
        echo "Secret 환경변수 매핑 형식이 올바르지 않습니다." >&2
        exit 1
      fi

      case "$variable_name" in
        ''|[0-9]*|*[!A-Za-z0-9_]*)
          echo "Secret 환경변수 이름이 올바르지 않습니다: $variable_name" >&2
          exit 1
          ;;
      esac

      if [ ! -r "$secret_file" ]; then
        echo "Secret 파일을 읽을 수 없습니다: $secret_file" >&2
        exit 1
      fi

      secret_value="$(cat "$secret_file")"
      export "$variable_name=$secret_value"
      unset secret_value
      shift
    done

    if [ "${1:-}" != "--" ]; then
      echo "애플리케이션 실행 명령 구분자가 없습니다." >&2
      exit 1
    fi
    shift

    if [ "$#" -eq 0 ]; then
      echo "실행할 애플리케이션 명령이 없습니다." >&2
      exit 1
    fi

    exec "$@"
{{- end }}
