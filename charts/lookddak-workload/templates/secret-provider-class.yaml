{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ required "secrets.secretProviderClassName is required when secrets are enabled" .Values.secrets.secretProviderClassName }}
  labels:
    {{- include "lookddak-workload.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    {{- toYaml .Values.secrets.parameters | nindent 4 }}
{{- end }}
