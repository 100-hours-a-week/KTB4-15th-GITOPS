# 워크로드 식별자와 실행 유형이다.
# type에는 "deployment" 또는 "cronjob"을 입력한다.
workload:
  name: ""
  type: ""
  runtimeRole: ""

# 워크로드는 공통 이미지 그룹 하나를 선택한다.
# 환경별 값 파일에서 각 그룹의 저장소와 변경할 수 없는 다이제스트를 제공한다.
imageGroup: ""
images:
  fe:
    repository: ""
    digest: ""
  be:
    repository: ""
    digest: ""
  ai:
    repository: ""
    digest: ""
  crawler:
    repository: ""
    digest: ""

container:
  port: null
  command: []
  args: []
  env: []


# 계속 실행되는 워크로드의 공통 롤링 배포와 종료 기본값이다.
# SSE 연결이나 백그라운드 작업 종료에 시간이 더 필요하면
# 워크로드별 값에서 종료 유예 시간을 재정의할 수 있다.
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 30

# 애플리케이션 워크로드는 Karpenter가 생성한 ARM64 노드에서만 실행한다.
# 서로 다른 워크로드의 복제본이 함께 계산되지 않도록
# 차트가 각 토폴로지 제약 조건에 워크로드 선택자를 추가한다.
scheduling:
  nodeSelector:
    kubernetes.io/arch: arm64
    lookddak.io/node-pool: general-purpose
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

# 자동 확장을 사용하지 않을 때만 적용한다.
replicaCount: null

# 워크로드 크기와 애플리케이션 상태 확인 경로를 확정한 뒤 값을 입력한다.
resources: {}
probes:
  startup: {}
  liveness: {}
  readiness: {}

service:
  enabled: false
  port: null

autoscaling:
  enabled: false
  minReplicas: null
  maxReplicas: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

serviceAccount:
  create: false
  name: ""
  roleArn: ""

secrets:
  enabled: false
  # SecretProviderClass의 Parameter·Startup 설정이 바뀌면 Pod Template checksum을 변경해
  # 새 Pod가 변경된 CSI 파일을 다시 읽도록 한다. 기존 워크로드의 일괄 재시작을 막기 위해 opt-in이다.
  rolloutOnChange: false
  secretProviderClassName: ""
  mountPath: ""
  parameters: {}
  # CSI 파일을 기존 애플리케이션이 사용하는 환경변수로 전달한다.
  # command에는 이미지가 원래 실행할 명령과 인자를 배열로 입력한다.
  startup:
    enabled: false
    scriptMountPath: /opt/lookddak/secret-startup
    environment: []
    command: []

tracing:
  enabled: false
  runtime: ""
  serviceName: ""
  sampler: always_on
  resourceAttributes: ""
  endpoints:
    grpc: http://alloy-cluster.monitoring.svc.cluster.local:4317
    http: http://alloy-cluster.monitoring.svc.cluster.local:4318
  agents:
    java:
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0@sha256:a36b256a59f03d5a4fbc080ca604ec9e971464e66ab53157f7067cf4a8e3d5f8
      command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
    nodejs:
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.81.2@sha256:2f4215e0fa96ba348002f0025d87b4f4d52b1be424c54efc490c7c205f69c4d0
      command: ["cp", "-r", "/autoinstrumentation/.", "/otel/"]
    python:
      image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.66b1-3@sha256:c92261b2dbbb0316e0a42a62721c0064ddf47f4090c7744450a9cc87a20ac762
      command: ["cp", "-r", "/autoinstrumentation/.", "/otel/"]
  initResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  env: []

routing:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

cronJob:
  nameSuffix: ""
  schedule: ""
  timeZone: ""
  suspend: false
  concurrencyPolicy: ""
  startingDeadlineSeconds: null
  successfulJobsHistoryLimit: null
  failedJobsHistoryLimit: null
  backoffLimit: null
  activeDeadlineSeconds: null
  restartPolicy: ""
  # Secret 시작 스크립트를 사용할 때는 최종 실행 명령 전체를 입력한다.
  # 사용하지 않을 때는 일반 container command/args를 덮어쓴다.
  command: []
  args: []
  # 같은 이미지와 Secret을 사용하지만 실행 시각·명령이 다른 작업을 추가한다.
  extraJobs: []
