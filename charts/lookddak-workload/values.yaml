# 워크로드 식별자와 실행 유형이다.
# type에는 "deployment" 또는 "cronjob"을 입력한다.
workload:
  name: ""
  type: ""
  runtimeRole: ""

# 워크로드는 공통 이미지 그룹 하나를 선택한다.
# 환경별 값 파일에서 각 그룹의 저장소와 변경할 수 없는 다이제스트를 제공한다.
imageGroup: ""
images:
  fe:
    repository: ""
    digest: ""
  be:
    repository: ""
    digest: ""
  ai:
    repository: ""
    digest: ""
  crawler:
    repository: ""
    digest: ""

container:
  port: null
  command: []
  args: []
  env: []

# 계속 실행되는 워크로드의 공통 롤링 배포와 종료 기본값이다.
# SSE 연결이나 백그라운드 작업 종료에 시간이 더 필요하면
# 워크로드별 값에서 종료 유예 시간을 재정의할 수 있다.
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 30

# 애플리케이션 워크로드는 Karpenter가 생성한 ARM64 노드에서만 실행한다.
# 서로 다른 워크로드의 복제본이 함께 계산되지 않도록
# 차트가 각 토폴로지 제약 조건에 워크로드 선택자를 추가한다.
scheduling:
  nodeSelector:
    kubernetes.io/arch: arm64
    lookddak.io/node-pool: general-purpose
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

# 자동 확장을 사용하지 않을 때만 적용한다.
replicaCount: null

# 워크로드 크기와 애플리케이션 상태 확인 경로를 확정한 뒤 값을 입력한다.
resources: {}
probes:
  startup: {}
  liveness: {}
  readiness: {}

service:
  enabled: false
  port: null

autoscaling:
  enabled: false
  minReplicas: null
  maxReplicas: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

serviceAccount:
  create: false
  name: ""
  roleArn: ""

secrets:
  enabled: false
  secretProviderClassName: ""
  mountPath: ""
  parameters: {}
  # CSI 파일을 기존 애플리케이션이 사용하는 환경변수로 전달한다.
  # command에는 이미지가 원래 실행할 명령과 인자를 배열로 입력한다.
  startup:
    enabled: false
    scriptMountPath: /opt/lookddak/secret-startup
    environment: []
    command: []

routing:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

cronJob:
  schedule: ""
  restartPolicy: ""
