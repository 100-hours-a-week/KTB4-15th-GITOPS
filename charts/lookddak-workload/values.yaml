# Workload identity and execution type.
# type accepts "deployment" or "cronjob".
workload:
  name: ""
  type: ""
  runtimeRole: ""

# A workload selects one shared image group. Environment-specific values files
# provide the repository and immutable digest for each group.
imageGroup: ""
images:
  fe:
    repository: ""
    digest: ""
  be:
    repository: ""
    digest: ""
  ai:
    repository: ""
    digest: ""
  crawler:
    repository: ""
    digest: ""

container:
  port: null
  command: []
  args: []
  env: []

# Common rollout and shutdown defaults for long-running workloads.
# Workload values may override the grace period when SSE or background work
# needs more time to finish.
deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 30

# Application workloads run only on Karpenter-provisioned ARM64 nodes.
# The chart supplies the workload selector to each topology constraint so
# replicas of different workloads are not counted together.
scheduling:
  nodeSelector:
    kubernetes.io/arch: arm64
    lookddak.io/node-pool: general-purpose
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 2
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

# Used only when autoscaling.enabled is false.
replicaCount: null

# Values are supplied after workload sizing and application health endpoints
# are confirmed.
resources: {}
probes:
  startup: {}
  liveness: {}
  readiness: {}

service:
  enabled: false
  port: null

autoscaling:
  enabled: false
  minReplicas: null
  maxReplicas: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

serviceAccount:
  create: false
  name: ""
  roleArn: ""

secrets:
  enabled: false
  secretProviderClassName: ""
  mountPath: ""
  parameters: {}

routing:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

cronJob:
  schedule: ""
  restartPolicy: ""
